name: Close stale issues

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC (09:00 JST)
  workflow_dispatch:
    inputs:
      days:
        description: "この日数を過ぎた Issue を close する"
        default: "30"
      dry_run:
        description: "true の場合は close せず対象を表示するだけ"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Close stale issues
        run: node .github/scripts/close-stale-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DAYS: ${{ inputs.days || '30' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          # 判定基準: updated (最終更新日) or created (作成日)
          STALE_BASIS: updated
          # このラベルが付いた Issue は close しない (カンマ区切り)
          EXEMPT_LABELS: "Notice,pinned,security"
          CLOSE_COMMENT: |
            この Issue は ${{ inputs.days || '30' }} 日以上更新がなかったため自動的に close されました。
            引き続き対応が必要な場合は再オープンするかコメントしてください。
