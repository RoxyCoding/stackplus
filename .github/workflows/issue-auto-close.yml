name: Close unanswered needs-info issues

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (do not comment or close issues)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: issue-auto-close-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.repository == 'RoxyCoding/stackplus' &&
      (github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.issue.number != 3 &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Label developer replies or close issues awaiting a response for 30 days
        run: node .github/scripts/issue-auto-close.cjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
